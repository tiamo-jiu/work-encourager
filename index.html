<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上班鼓励器</title>
<meta name="theme-color" content="#F0F2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="上班鼓励器">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B6B45'/%3E%3Ctext x='32' y='44' font-size='36' font-family='Helvetica,Arial' font-weight='bold' text-anchor='middle' fill='%23fff'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F0F2EF;
    --card:#FFFFFF;
    --ink:#0F1613;
    --muted:#737C78;
    --green:#0B6B45;
    --green-deep:#075437;
    --tint:#E8F0EA;
    --tint-deep:#14503A;
    --line:#E5E8E3;
    --radius:20px;
    --num-font: "SF Pro Display", -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    --ui-font: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, #F7F9F5 0%, var(--bg) 55%, #E9EDE8 100%);
    font-family:var(--ui-font);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:26px 24px 34px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .shell{width:100%;max-width:1000px;min-width:0;}

  /* ===== 顶部标题栏 ===== */
  .app-header{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand-mark{
    width:44px;height:44px;flex:none;border-radius:14px;
    background:var(--green);color:#fff;
    display:grid;place-items:center;
  }
  .brand-mark svg{width:20px;height:20px;}
  .brand-mark span{
    font-family:var(--num-font);font-size:21px;font-weight:700;line-height:1;
    transform:translateY(-1px);
  }
  h1{
    margin:0;font-size:24px;font-weight:700;letter-spacing:.04em;line-height:1.2;
  }
  .header-actions{display:flex;align-items:center;gap:8px;flex:none;}
  .icon-btn{
    width:44px;height:44px;border-radius:12px;
    border:1px solid var(--line);background:#fff;color:var(--muted);
    display:grid;place-items:center;cursor:pointer;
    transition:background .16s ease,color .16s ease,border-color .16s ease;
  }
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn:hover{background:var(--tint);color:var(--green-deep);border-color:#D5E1D8;}
  .icon-btn.is-on{background:var(--tint);color:var(--green-deep);border-color:#C9DACF;}
  .icon-btn:active{transform:translateY(1px);}
  .icon-btn:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px;}

  /* ===== 卡片通用 ===== */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(15,22,19,.03);
  }
  .card--main{padding:26px 30px 28px;}
  .card--progress{margin-top:16px;padding:22px 30px 24px;}

  /* ===== 时钟与状态 ===== */
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;}
  .clock-block{min-width:0;}
  .date{margin:0 0 6px;font-size:15.5px;color:var(--muted);letter-spacing:.01em;}
  .time{
    margin:0;font-family:var(--num-font);font-size:42px;font-weight:700;
    letter-spacing:.005em;line-height:1.1;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  }
  .status-block{text-align:right;flex:none;padding-top:2px;}
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    padding:7px 13px;border-radius:999px;
    background:var(--tint);color:var(--tint-deep);
    font-size:13.5px;font-weight:600;letter-spacing:.02em;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}
  .pill--working .dot{animation:blip 2.4s ease-in-out infinite;}
  @keyframes blip{0%,100%{opacity:1;}50%{opacity:.35;}}
  .pill--pause{background:#ECEDE9;color:#5D6661;}
  .pill--pause .dot{background:#9AA29D;animation:none;}
  .pill--off{background:#ECEDE9;color:#5D6661;}
  .pill--off .dot{background:#9AA29D;animation:none;}
  .countdown{margin:11px 0 0;font-size:13.5px;color:var(--muted);}
  .countdown b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;}

  /* ===== 金额区 ===== */
  .money{text-align:center;margin-top:22px;}
  .label{margin:0 0 2px;font-size:14.5px;color:var(--muted);letter-spacing:.08em;}
  .amount{
    display:flex;align-items:flex-start;justify-content:center;
    font-family:var(--num-font);font-weight:800;
    font-size:clamp(50px,7.4vw,78px);line-height:1.04;letter-spacing:-.015em;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  }
  .yen{font-size:.32em;color:var(--green);font-weight:700;margin-right:.16em;margin-top:.14em;}
  .rate{margin:10px 0 0;font-size:13.5px;color:var(--muted);}
  .rate b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
  .encourage-wrap{display:flex;justify-content:center;margin-top:16px;}
  .encourage{
    margin:0;display:inline-block;
    background:var(--tint);color:var(--tint-deep);
    padding:10px 20px;border-radius:999px;
    font-size:14.5px;font-weight:600;letter-spacing:.01em;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px;}
  .btn-primary{
    border:0;border-radius:12px;background:var(--green);color:#fff;
    font-size:15px;font-weight:600;letter-spacing:.06em;
    padding:12px 30px;cursor:pointer;font-family:inherit;
    transition:background .16s ease,transform .1s ease;
  }
  .btn-primary:hover{background:var(--green-deep);}
  .btn-primary:active{transform:translateY(1px);}
  .hint{margin:0;font-size:12.5px;color:var(--muted);letter-spacing:.04em;}

  /* ===== 进度区 ===== */
  .progress-head{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;}
  .progress-head svg{width:15px;height:15px;}
  .pct{
    margin:10px 0 0;font-family:var(--num-font);
    font-size:34px;font-weight:700;color:var(--green);line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .bar{
    height:10px;border-radius:999px;background:#EDF0EA;overflow:hidden;margin-top:14px;
  }
  .bar-fill{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#0B6B45 0%,#128354 100%);
  }
  .bar-note{margin:11px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .bar-note b{color:var(--ink);font-weight:600;}

  .month-block{
    margin-top:18px;padding-top:18px;border-top:1px solid var(--line);
  }
  .month-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .month-label{font-size:13.5px;color:var(--muted);letter-spacing:.06em;}
  .month-value{
    font-family:var(--num-font);font-size:28px;font-weight:750;line-height:1.15;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .month-value .unit{font-size:.6em;font-weight:600;margin-left:.12em;color:var(--muted);}
  .month-note{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.65;letter-spacing:.01em;}

  .stats{
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px;
  }
  .stat{background:#F6F8F4;border:1px solid #EDF0EA;border-radius:14px;padding:13px 16px;min-width:0;}
  .stat-label{font-size:12.5px;color:var(--muted);letter-spacing:.04em;}
  .stat-value{
    margin-top:5px;font-family:var(--num-font);font-size:21px;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .stat-value .unit{font-size:.62em;font-weight:600;color:var(--muted);margin-left:.15em;}

  /* ===== 最小化视图 ===== */
  body.compact{padding:22px 20px;align-items:center;}
  body.compact .shell{max-width:420px;}
  body.compact h1{font-size:20px;}
  body.compact .brand-mark{width:38px;height:38px;border-radius:12px;}
  body.compact .card--main{padding:20px 22px 22px;}
  body.compact .time{font-size:30px;}
  body.compact .amount{font-size:44px;}
  body.compact .card--progress,
  body.compact .encourage-wrap,
  body.compact .rate{display:none;}
  body.compact .money{margin-top:14px;}
  body.compact .actions{margin-top:16px;}

  /* ===== 设置面板 ===== */
  .overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(18,26,22,.28);
    display:flex;align-items:center;justify-content:center;
    padding:22px;
  }
  .overlay[hidden]{display:none;}
  .sheet{
    width:100%;max-width:430px;background:#fff;border-radius:18px;
    border:1px solid var(--line);padding:22px 24px 20px;
    box-shadow:0 18px 50px rgba(15,22,19,.18);
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985);}to{opacity:1;transform:none;}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-title{margin:0;font-size:17px;font-weight:700;letter-spacing:.04em;}
  .close-btn{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--muted);display:grid;place-items:center;cursor:pointer;
  }
  .close-btn:hover{background:#F4F6F2;}
  .close-btn svg{width:15px;height:15px;}
  .field{margin-bottom:14px;}
  .field-label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;letter-spacing:.03em;}
  .input{
    width:100%;height:44px;border-radius:10px;border:1px solid #DCE1DA;
    background:#F8FAF6;padding:0 12px;font-size:16px;color:var(--ink);
    font-family:inherit;font-variant-numeric:tabular-nums;
    -webkit-appearance:none;appearance:none;
  }
  .input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(11,107,69,.1);}
  .seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .seg button{
    height:44px;border-radius:10px;border:1px solid #DCE1DA;background:#F8FAF6;
    font-size:14px;color:var(--muted);font-family:inherit;cursor:pointer;
    transition:background .14s ease,color .14s ease,border-color .14s ease;
  }
  .seg button.on{background:var(--tint);border-color:#C4D8CA;color:var(--tint-deep);font-weight:600;}

  /* 自定义时间选择器：替代原生 time 控件的蓝色滚轮 */
  .picker{position:relative;}
  .picker-btn{
    width:100%;height:44px;border-radius:10px;border:1px solid #DCE1DA;background:#F8FAF6;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 12px;cursor:pointer;font-family:var(--num-font);
    font-size:16px;font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .picker-btn:hover{background:#F2F5EF;}
  .picker-btn[aria-expanded="true"]{background:#fff;border-color:var(--green);box-shadow:0 0 0 3px rgba(11,107,69,.1);}
  .picker-btn:focus-visible{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(11,107,69,.1);}
  .picker-caret{width:14px;height:14px;color:var(--muted);transition:transform .16s ease;}
  .picker-btn[aria-expanded="true"] .picker-caret{transform:rotate(180deg);color:var(--green);}
  .picker-pop{
    position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:6;
    background:#fff;border:1px solid #DCE1DA;border-radius:12px;
    box-shadow:0 14px 32px rgba(15,22,19,.16);
    padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;
  }
  .picker-pop[hidden]{display:none;}
  .picker-hint{
    font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0 4px;letter-spacing:.08em;
  }
  .picker-col{
    max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;
    scrollbar-width:thin;
  }
  .picker-item{
    border:0;background:transparent;height:32px;border-radius:7px;flex:none;
    font-family:var(--num-font);font-size:15px;color:var(--ink);
    font-variant-numeric:tabular-nums;cursor:pointer;transition:background .12s ease;
  }
  .picker-item:hover{background:#F1F4EF;}
  .picker-item.on{background:var(--tint);color:var(--tint-deep);font-weight:700;}
  .form-err{margin:0 0 10px;font-size:12.5px;color:#A63A2B;min-height:0;}
  .form-err:empty{display:none;}
  .sheet-foot{display:flex;gap:10px;margin-top:6px;}
  .btn-ghost{
    flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;
    font-size:14.5px;color:var(--muted);font-family:inherit;cursor:pointer;
  }
  .btn-ghost:hover{background:#F4F6F2;}
  .btn-save{
    flex:1.4;height:44px;border-radius:10px;border:0;background:var(--green);color:#fff;
    font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;letter-spacing:.05em;
  }
  .btn-save:hover{background:var(--green-deep);}

  /* ===== 轻提示 ===== */
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(8px);
    background:rgba(15,22,19,.9);color:#fff;font-size:13px;letter-spacing:.04em;
    padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;z-index:60;white-space:nowrap;
  }
  .toast[hidden]{display:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:680px){
    body{padding:18px 14px 26px;}
    .card--main{padding:20px 18px 22px;}
    .card--progress{padding:18px 18px 20px;}
    h1{font-size:20px;}
    .brand-mark{width:38px;height:38px;border-radius:12px;}
    .top-row{flex-direction:column;gap:14px;}
    .status-block{text-align:left;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .countdown{margin:0;}
    .time{font-size:34px;}
    .amount{font-size:clamp(42px,11vw,54px);}
    .pct{font-size:29px;}
    .month-value{font-size:24px;}
    .stats{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span>¥</span></div>
      <h1>上班鼓励器</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="pinBtn" type="button" aria-label="窗口置顶" title="窗口置顶" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.2c2.1 0 3.8 1.7 3.8 3.8 0 1.5-.9 2.8-2.2 3.4l1.1 4.1H9.3l1.1-4.1a3.8 3.8 0 0 1-2.2-3.4c0-2.1 1.7-3.8 3.8-3.8Z"/>
          <path d="M12 14.5V21"/>
        </svg>
      </button>
      <button class="icon-btn" id="compactBtn" type="button" aria-label="最小化视图" title="最小化视图">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5.5 14.5 11l-5.5 5.5"/><path d="M4 4.5v15"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H7a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== 主卡片：时间 / 状态 / 已赚 / 鼓励语 ===== -->
  <section class="card card--main">
    <div class="top-row">
      <div class="clock-block">
        <p class="date" id="dateText">—</p>
        <p class="time" id="timeText">--:--:--</p>
      </div>
      <div class="status-block">
        <span class="pill pill--working" id="statusPill"><i class="dot"></i><span id="statusText">上班中</span></span>
        <p class="countdown" id="countdownText">距下班还有 <b>—</b></p>
      </div>
    </div>

    <div class="money">
      <p class="label">今日已赚</p>
      <div class="amount"><span class="yen">¥</span><span id="earnedText">0.0000</span></div>
      <p class="rate">当前赚钱速度 <b id="rateText">¥0.0000 / 秒</b></p>
    </div>

    <div class="encourage-wrap">
      <p class="encourage" id="encourageText">正在读取你的时间…</p>
    </div>

    <div class="actions">
      <button class="btn-primary" id="toggleBtn" type="button">关闭计时器</button>
      <p class="hint" id="pauseHint" hidden>计时已暂停，金额停在按下按钮的那一刻</p>
    </div>
  </section>

  <!-- ===== 进度卡片：工时进度 / 本月累计 / 时薪 ===== -->
  <section class="card card--progress">
    <div class="progress-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="9.4"/><path d="M12 7.4V12l3.2 2"/>
      </svg>
      <span>今日工时进度</span>
    </div>
    <p class="pct" id="pctText">0.0%</p>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <p class="bar-note" id="workedText">已工作 <b>0</b> / 总工作 <b>0</b> 小时</p>

    <div class="month-block">
      <div class="month-top">
        <span class="month-label">本月累计</span>
        <span class="month-value"><span class="unit">¥</span><span id="monthText">0.00</span></span>
      </div>
      <p class="month-note">已过的日子按满勤补算，本月只计已赚，不含亏损</p>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">时薪</div>
        <div class="stat-value"><span class="unit">¥</span><span id="hourlyText">0.00</span><span class="unit">/时</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">今日满勤可得</div>
        <div class="stat-value"><span class="unit">¥</span><span id="fullText">0.00</span></div>
      </div>
    </div>
  </section>
</div>

<!-- ===== 设置面板 ===== -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <p class="sheet-title" id="sheetTitle">设置</p>
      <button class="close-btn" id="closeSheet" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="field">
      <label class="field-label" for="inSalary">日薪（元）</label>
      <input class="input" id="inSalary" type="number" min="1" max="100000" step="0.01" inputmode="decimal">
    </div>

    <div class="field">
      <label class="field-label" for="inHours">每日工作时长（小时）</label>
      <input class="input" id="inHours" type="number" min="0.5" max="16" step="0.5" inputmode="decimal">
    </div>

    <div class="field">
      <label class="field-label">上班起始时间</label>
      <div class="picker" id="startPicker">
        <button class="picker-btn" id="startPickerBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="startPickerValue">09:00</span>
          <svg class="picker-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9.5 12 15.5 18 9.5"/>
          </svg>
        </button>
        <div class="picker-pop" id="startPickerPop" hidden>
          <div class="picker-hint">时</div>
          <div class="picker-hint">分</div>
          <div class="picker-col" id="hourCol" role="listbox" aria-label="小时"></div>
          <div class="picker-col" id="minCol" role="listbox" aria-label="分钟"></div>
        </div>
      </div>
    </div>

    <div class="field">
      <span class="field-label">计薪工作日</span>
      <div class="seg" id="segWorkMode">
        <button type="button" data-mode="weekday" class="on">周一至周五</button>
        <button type="button" data-mode="everyday">每天都算</button>
      </div>
    </div>

    <p class="form-err" id="formErr"></p>

    <div class="sheet-foot">
      <button class="btn-ghost" id="cancelSheet" type="button">取消</button>
      <button class="btn-save" id="saveSheet" type="button">保存设置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';

  /* ===== 配置：读取 / 保存 ===== */
  var CFG_KEY = 'work-encourager-config-v1';
  var DEFAULTS = { salary: 450, hours: 9, start: '09:00', workMode: 'weekday' };
  var WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];

  function loadCfg() {
    var out = { salary: DEFAULTS.salary, hours: DEFAULTS.hours, start: DEFAULTS.start, workMode: DEFAULTS.workMode };
    try {
      var raw = localStorage.getItem(CFG_KEY);
      if (!raw) return out;
      var p = JSON.parse(raw) || {};
      var s = Number(p.salary);
      if (isFinite(s) && s > 0) out.salary = s;
      var h = Number(p.hours);
      if (isFinite(h) && h > 0 && h <= 24) out.hours = h;
      if (typeof p.start === 'string' && /^[0-2]\d:[0-5]\d$/.test(p.start)) out.start = p.start;
      if (p.workMode === 'everyday' || p.workMode === 'weekday') out.workMode = p.workMode;
    } catch (e) { /* 配置损坏时回落到默认值 */ }
    return out;
  }

  function saveCfg() {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) { /* 隐私模式下忽略 */ }
  }

  var cfg = loadCfg();
  var paused = false;
  var pausedAt = 0;

  /* ===== DOM ===== */
  var $ = function (id) { return document.getElementById(id); };
  var elDate = $('dateText'), elTime = $('timeText');
  var elPill = $('statusPill'), elStatus = $('statusText'), elCountdown = $('countdownText');
  var elEarned = $('earnedText'), elRate = $('rateText'), elEncourage = $('encourageText');
  var elToggle = $('toggleBtn'), elPauseHint = $('pauseHint');
  var elPct = $('pctText'), elBar = $('barFill'), elWorked = $('workedText');
  var elMonth = $('monthText'), elHourly = $('hourlyText'), elFull = $('fullText');
  var overlay = $('overlay'), toastEl = $('toast');

  /* ===== 工具函数 ===== */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function fmtNum(n, dec) {
    var s = Math.abs(n).toFixed(dec);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (n < 0 ? '-' : '') + parts.join('.');
  }

  function startSeconds(str) {
    var p = str.split(':');
    return Number(p[0]) * 3600 + Number(p[1]) * 60;
  }

  function secOfDay(d) {
    return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
  }

  function isPayDay(d) {
    if (cfg.workMode === 'everyday') return true;
    return d.getDay() !== 0 && d.getDay() !== 6;
  }

  function workWindow() {
    var s = startSeconds(cfg.start);
    var dur = Math.min(cfg.hours * 3600, 86400 - s);
    if (dur < 60) dur = 60;
    return { startSec: s, durSec: dur, endSec: s + dur };
  }

  function fmtDur(sec) {
    var total = Math.max(0, Math.round(sec));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    if (h > 0 && m > 0) return h + '小时' + m + '分';
    if (h > 0) return h + '小时';
    if (m > 0) return m + '分';
    return '不到1分';
  }

  function fmtHours(sec) {
    var t = (Math.round((sec / 3600) * 10) / 10).toFixed(1);
    return t.replace(/\.0$/, '');
  }

  /* ===== 某一时刻的完整状态 ===== */
  function snapshot(ms) {
    var d = new Date(ms);
    var w = workWindow();
    var now = secOfDay(d);
    var payDay = isPayDay(d);
    var status;
    if (!payDay) status = 'rest';
    else if (now < w.startSec) status = 'before';
    else if (now >= w.endSec) status = 'off';
    else status = 'working';

    var worked = 0;
    if (status === 'working') worked = now - w.startSec;
    else if (status === 'off') worked = w.durSec;

    var earned = w.durSec > 0 ? cfg.salary * worked / w.durSec : 0;
    return {
      d: d, status: status, payDay: payDay, worked: worked,
      durSec: w.durSec, startSec: w.startSec, nowSec: now, earned: earned,
      remaining: Math.max(0, w.durSec - worked)
    };
  }

  function monthEarned(nowMs, todayEarned) {
    var d = new Date(nowMs);
    var cursor = new Date(d.getFullYear(), d.getMonth(), 1);
    var days = 0;
    while (cursor.getDate() < d.getDate() && cursor.getMonth() === d.getMonth()) {
      if (isPayDay(cursor)) days++;
      cursor.setDate(cursor.getDate() + 1);
    }
    var past = days * cfg.salary;
    var today = isPayDay(d) ? todayEarned : 0;
    return past + today;
  }

  function encourageOf(snap) {
    var x = fmtDur(snap.remaining);
    if (snap.status === 'rest') return '今天休息，一件T恤留给下一个工作日';
    if (snap.status === 'before') return '再过' + x + '就开工，一件T恤已经在等你';
    if (snap.status === 'off') return '今日满勤达成，一件T恤赚回来了';
    if (snap.remaining <= 60) return '今天的T恤已经赚回来了，收个尾吧';
    return '再过' + x + '，一件T恤就赚回来了';
  }

  /* ===== 渲染 ===== */
  function render() {
    var now = Date.now();
    var live = new Date(now);

    elDate.textContent = live.getFullYear() + '年' + (live.getMonth() + 1) + '月' + live.getDate() +
      '日 星期' + WEEK_CN[live.getDay()];
    elTime.textContent = pad2(live.getHours()) + ':' + pad2(live.getMinutes()) + ':' + pad2(live.getSeconds());

    var snap = snapshot(paused ? pausedAt : now);

    /* 状态标签 */
    var text = '上班中', cls = 'pill pill--working';
    if (paused) { text = '计时暂停'; cls = 'pill pill--pause'; }
    else if (snap.status === 'rest') { text = '今天休息'; cls = 'pill pill--off'; }
    else if (snap.status === 'before') { text = '还未上班'; cls = 'pill pill--off'; }
    else if (snap.status === 'off') { text = '已下班'; cls = 'pill pill--off'; }
    elPill.className = cls;
    elStatus.textContent = text;

    /* 剩余时间 */
    if (snap.status === 'working') {
      elCountdown.innerHTML = '距下班还有 <b>' + fmtDur(snap.remaining) + '</b>';
    } else if (snap.status === 'before') {
      elCountdown.innerHTML = '距上班还有 <b>' + fmtDur(Math.max(0, snap.startSec - snap.nowSec)) + '</b>';
    } else if (snap.status === 'off') {
      elCountdown.innerHTML = '今日工时 <b>已满</b>';
    } else {
      elCountdown.innerHTML = '休息日 <b>不计薪</b>';
    }

    /* 金额与速度 */
    elEarned.textContent = fmtNum(snap.earned, 4);
    var rate = snap.durSec > 0 ? cfg.salary / snap.durSec : 0;
    elRate.textContent = '¥' + rate.toFixed(4) + ' / 秒';

    elEncourage.textContent = encourageOf(snap);

    /* 进度 */
    var pct = snap.durSec > 0 ? (snap.worked / snap.durSec) * 100 : 0;
    var pctShown = Math.min(100, Math.max(0, pct));
    elPct.textContent = pctShown.toFixed(1) + '%';
    elBar.style.width = pctShown.toFixed(2) + '%';
    elWorked.innerHTML = '已工作 <b>' + fmtHours(snap.worked) + '</b> / 总工作 <b>' +
      fmtHours(snap.durSec) + '</b> 小时';

    /* 本月累计 / 时薪 / 满勤 */
    elMonth.textContent = fmtNum(monthEarned(paused ? pausedAt : now, snap.earned), 2);
    var hours = snap.durSec / 3600;
    elHourly.textContent = (hours > 0 ? cfg.salary / hours : 0).toFixed(2);
    elFull.textContent = fmtNum(cfg.salary, 2);

    /* 按钮文案 */
    elToggle.textContent = paused ? '恢复计时器' : '关闭计时器';
    elPauseHint.hidden = !paused;
  }

  var rafId = 0;
  function loop() {
    render();
    rafId = window.requestAnimationFrame(loop);
  }

  /* ===== 计时器开关 ===== */
  elToggle.addEventListener('click', function () {
    if (paused) {
      paused = false;
      pausedAt = 0;
      showToast('已恢复，金额重新按当前时间计算');
    } else {
      paused = true;
      pausedAt = Date.now();
      showToast('计时已暂停，金额已冻结');
    }
    render();
  });

  /* ===== 设置面板 ===== */
  var inSalary = $('inSalary'), inHours = $('inHours');
  var seg = $('segWorkMode'), formErr = $('formErr');
  var pendingMode = cfg.workMode;
  var lastFocus = null;

  /* 自定义时间选择器 */
  var picker = $('startPicker'), pickerBtn = $('startPickerBtn');
  var pickerPop = $('startPickerPop'), pickerValue = $('startPickerValue');
  var hourCol = $('hourCol'), minCol = $('minCol');
  var selStart = cfg.start;

  function pickerItem(kind, val) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'picker-item';
    b.setAttribute('data-kind', kind);
    b.setAttribute('data-val', val);
    b.setAttribute('role', 'option');
    b.textContent = val;
    return b;
  }

  function buildPicker() {
    var i;
    for (i = 0; i < 24; i++) hourCol.appendChild(pickerItem('h', pad2(i)));
    for (i = 0; i < 60; i++) minCol.appendChild(pickerItem('m', pad2(i)));
  }

  function centerCol(col, index) {
    col.scrollTop = Math.max(0, index * 34 - (col.clientHeight - 32) / 2);
  }

  function paintPicker(scrollTo) {
    pickerValue.textContent = selStart;
    var hh = selStart.slice(0, 2), mm = selStart.slice(3, 5);
    Array.prototype.forEach.call(document.querySelectorAll('.picker-item'), function (b) {
      var on = b.getAttribute('data-val') === (b.getAttribute('data-kind') === 'h' ? hh : mm);
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (scrollTo) {
      centerCol(hourCol, parseInt(hh, 10));
      centerCol(minCol, parseInt(mm, 10));
    }
  }

  function openPicker() {
    pickerPop.hidden = false;
    pickerBtn.setAttribute('aria-expanded', 'true');
    paintPicker(false);
    window.requestAnimationFrame(function () { paintPicker(true); });
  }

  function closePicker() {
    pickerPop.hidden = true;
    pickerBtn.setAttribute('aria-expanded', 'false');
  }

  pickerBtn.addEventListener('click', function () {
    if (pickerPop.hidden) openPicker(); else closePicker();
  });

  pickerPop.addEventListener('click', function (e) {
    var item = e.target.closest ? e.target.closest('.picker-item') : null;
    if (!item) return;
    var kind = item.getAttribute('data-kind'), val = item.getAttribute('data-val');
    if (kind === 'h') selStart = val + ':' + selStart.slice(3, 5);
    else selStart = selStart.slice(0, 2) + ':' + val;
    paintPicker(false);
  });

  document.addEventListener('click', function (e) {
    if (pickerPop.hidden || picker.contains(e.target)) return;
    closePicker();
  });

  function paintSeg() {
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === pendingMode);
    });
  }

  function openSheet() {
    lastFocus = document.activeElement;
    inSalary.value = cfg.salary;
    inHours.value = cfg.hours;
    selStart = cfg.start;
    paintPicker(false);
    closePicker();
    pendingMode = cfg.workMode;
    paintSeg();
    formErr.textContent = '';
    overlay.hidden = false;
    setTimeout(function () { inSalary.focus(); inSalary.select(); }, 60);
  }

  function closeSheet() {
    closePicker();
    overlay.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  $('settingsBtn').addEventListener('click', openSheet);
  $('closeSheet').addEventListener('click', closeSheet);
  $('cancelSheet').addEventListener('click', closeSheet);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeSheet(); });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!pickerPop.hidden) { closePicker(); return; }
    if (!overlay.hidden) closeSheet();
  });

  seg.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button') : null;
    if (!btn || !seg.contains(btn)) return;
    pendingMode = btn.getAttribute('data-mode');
    paintSeg();
  });

  $('saveSheet').addEventListener('click', function () {
    var salary = parseFloat(inSalary.value);
    var hours = parseFloat(inHours.value);
    var start = selStart;

    if (!isFinite(salary) || salary <= 0) { formErr.textContent = '请填写大于 0 的日薪。'; inSalary.focus(); return; }
    if (salary > 100000) { formErr.textContent = '日薪看起来过大了，请检查一下。'; inSalary.focus(); return; }
    if (!isFinite(hours) || hours < 0.5 || hours > 16) { formErr.textContent = '每日工作时长需在 0.5 到 16 小时之间。'; inHours.focus(); return; }
    var sSec = startSeconds(start);
    if (sSec + hours * 3600 > 86400) { formErr.textContent = '上班时间加上工时超过了当天 24 点，请调整起始时间或时长。'; pickerBtn.focus(); return; }

    cfg.salary = salary;
    cfg.hours = hours;
    cfg.start = start;
    cfg.workMode = pendingMode;
    saveCfg();
    closedSheetToast();
    render();
  });

  function closedSheetToast() {
    closeSheet();
    showToast('设置已保存');
  }

  /* ===== 窗口置顶（仅桌面版可用） ===== */
  var desktopHost = window.__encouragerApp;
  var pinBtn = $('pinBtn');
  if (desktopHost && pinBtn) {
    pinBtn.hidden = false;
    var isPinned = desktopHost.pinned !== false;
    function paintPin(on) {
      pinBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      pinBtn.classList.toggle('is-on', on);
      pinBtn.setAttribute('title', on ? '取消置顶' : '窗口置顶');
      pinBtn.setAttribute('aria-label', on ? '取消置顶' : '窗口置顶');
    }
    paintPin(isPinned);
    pinBtn.addEventListener('click', function () {
      isPinned = !isPinned;
      paintPin(isPinned);
      try { desktopHost.setPin(isPinned); } catch (e) { /* 忽略 */ }
    });
  }

  /* ===== 最小化视图 ===== */
  $('compactBtn').addEventListener('click', function () {
    var on = document.body.classList.toggle('compact');
    this.setAttribute('aria-pressed', on ? 'true' : 'false');
    this.setAttribute('title', on ? '展开完整视图' : '最小化视图');
    this.setAttribute('aria-label', on ? '展开完整视图' : '最小化视图');
  });

  /* ===== 轻提示 ===== */
  var toastTimer = 0;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    requestAnimationFrame(function () { toastEl.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
      setTimeout(function () { toastEl.hidden = true; }, 220);
    }, 1800);
  }

  /* ===== 启动 ===== */
  buildPicker();
  paintPicker(false);
  render();
  rafId = window.requestAnimationFrame(loop);
  window.addEventListener('pagehide', function () { window.cancelAnimationFrame(rafId); });
})();
</script>
</body>
</html>
